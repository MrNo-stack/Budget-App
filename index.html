<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<style>

  --neg:#B42318; --neg-bg:#FDE4E1; --input:#EDF6E8; --shadow:0 1px 2px rgba(20,32,51,.06),0 6px 20px rgba(20,32,51,.05);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1219; --surface:#151D27; --surface2:#1D2733; --ink:#E7ECF3; --muted:#92A0B3; --line:#263140;
  --accent:#9DB9F2; --accent-ink:#0C1219; --pos:#5CD0A8; --pos-bg:#12332A; --warn:#E8B64F; --warn-bg:#35290E;
  --neg:#FF8C7C; --neg-bg:#3A1A17; --input:#1B2A1F; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1219; --surface:#151D27; --surface2:#1D2733; --ink:#E7ECF3; --muted:#92A0B3; --line:#263140;
  --accent:#9DB9F2; --accent-ink:#0C1219; --pos:#5CD0A8; --pos-bg:#12332A; --warn:#E8B64F; --warn-bg:#35290E;
  --neg:#FF8C7C; --neg-bg:#3A1A17; --input:#1B2A1F; --shadow:none; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.neg{background:var(--neg-bg);color:var(--neg)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{max-width:100%}
.field input[type=number]{font-family:var(--mono)}

.helptext p{margin:0 0 6px}.helptext p:last-child{margin:0}
.field .hint{font-size:12px;color:var(--muted)}
.form{padding:14px;display:grid;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg.two{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.paydays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.payday{padding:12px;min-width:0}
.payday .d{font-weight:800;font-size:15px}
.payday .n{font-size:12.5px;color:var(--muted)}
.payday .m{font-family:var(--mono);font-weight:600;margin-top:4px}
details.pc{border-radius:14px}
details.pc>summary{list-style:none;cursor:pointer;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
details.pc>summary::-webkit-details-marker{display:none}
details.pc .range{font-weight:800}

.det{padding:2px 14px 14px;display:grid;gap:0}
.det .li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.det .li:first-child{border-top:0}

.det .li.strong{font-weight:800}
.det .li.sub span:first-child{padding-left:12px;color:var(--muted)}
.pcs{display:grid;gap:10px}
.tablewrap{overflow-x:auto;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}

th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tr.cur td{background:var(--surface2);font-weight:700}tr.past td{color:var(--muted)}
td input{font:inherit;font-family:var(--mono);width:96px;text-align:right;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
.chart{padding:12px 8px 6px}
.chart svg{width:100%;height:auto;display:block}
svg[data-ch]{touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.readout{min-height:44px;padding:4px 12px 0;display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline;font-size:13.5px}
.readout b{font-family:var(--mono);font-size:17px}
.readout .when{font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:4px 12px 10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--muted)}
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sched .dn{font-size:11.5px;text-align:center;color:var(--muted);font-weight:700}
.sched button{font:inherit;font-size:11px;font-weight:700;padding:0;min-width:0;letter-spacing:-.2px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);min-height:40px;cursor:pointer}
@media(max-width:350px){.sched{gap:4px}.sched button{font-size:9.5px}}
.sched button[aria-pressed=true]{background:var(--pos-bg);color:var(--pos);border-color:var(--pos)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{font:inherit;font-weight:700;font-size:12.5px;border:0;background:none;color:var(--muted);padding:9px 2px 8px;border-radius:10px;cursor:pointer;position:relative}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--surface2)}
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:grid;gap:14px;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:18px}
.sheet .acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sheet .acts .r{display:flex;gap:10px;margin-left:auto}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:60}
.toast[hidden]{display:none}
textarea{font:12.5px/1.4 var(--mono);width:100%;min-height:110px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}
@media (max-width:420px){.paydays{grid-template-columns:1fr}.hero .big{font-size:26px}}
@media (min-width:640px){.pcs{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric.span2{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';
/* ---------- constants & helpers ---------- */
var FREQS=['Daily','Work Days','Weekly','Bi-Weekly','Monthly','Monthly (Last Day)'];
var COMP={'Daily':365,'Weekly':52,'Monthly':12,'Quarterly':4,'Semi-annually':2,'Annually':1};
var KEY='monthly-expenses-generic-v1', DAY=864e5;
var PLANNED={'Monthly':1,'Monthly (Last Day)':1};
var DTYPES=['Credit Card','Auto Loan','Student Loan','Mortgage','Personal Loan','Medical','Other'];
var STRATS=['Avalanche','Snowball','Custom','Minimums only'];
var STRAT_HINT={'Avalanche':'Highest interest rate first','Snowball':'Smallest balance first','Custom':'Your own priority numbers, 1 first','Minimums only':'Minimum payments only, no extra'};
var MAXSRC=4;

function toDN(y,m,d){return Math.floor(Date.UTC(y,m,d)/DAY)}
function isoDN(s){var p=String(s||'').split('-').map(Number);return p.length===3&&!isNaN(p[0])?toDN(p[0],p[1]-1,p[2]):NaN}
function dnDate(dn){return new Date(dn*DAY)}
function dnISO(dn){return dnDate(dn).toISOString().slice(0,10)}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function addMonths(dn,n){var d=dnDate(dn),y=d.getUTCFullYear(),m=d.getUTCMonth()+n;var yy=y+Math.floor(m/12),mm=((m%12)+12)%12;return toDN(yy,mm,Math.min(d.getUTCDate(),dim(yy,mm)))}
function monthStart(dn){var d=dnDate(dn);return toDN(d.getUTCFullYear(),d.getUTCMonth(),1)}
function monthsBetween(a,b){var x=dnDate(a),y=dnDate(b);return (y.getUTCFullYear()-x.getUTCFullYear())*12+y.getUTCMonth()-x.getUTCMonth()}
function todayDN(){var n=new Date();return toDN(n.getFullYear(),n.getMonth(),n.getDate())}
function fd(dn,o){return dnDate(dn).toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o||{month:'short',day:'numeric'}))}
function fdl(dn){return fd(dn,{weekday:'short',month:'short',day:'numeric'})}
function fdy(dn){return fd(dn,{month:'short',day:'numeric',year:'numeric'})}
function fmy(dn){return fd(dn,{month:'short',year:'numeric'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var f2=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
var f0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
function m2(x){x=Math.round(x*100)/100;if(Object.is(x,-0))x=0;return (x<0?'−':'')+f2.format(Math.abs(x))}
function m0(x){x=Math.round(x);if(Object.is(x,-0))x=0;return (x<0?'−':'')+f0.format(Math.abs(x))}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}
function num(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}

/* ---------- default data (generic examples) ---------- */
function newSource(i,amount,anchor){return {name:'Pay source '+(i+1),amount:amount||0,every:14,anchor:anchor||'2026-04-16',start:'2025-12-21',pat:[0,1,1,1,1,1,0]}}
function defaults(){
  var E=function(t,a,f,d){return {id:uid(),title:t,amount:a,freq:f,due:d||''}};
  var T=todayDN(), anchor=dnISO(T-5), x;
  var ex=[E('Rent',1300,'Monthly',1),E('Gym Membership',30,'Monthly',3),E('Car Payment',280,'Monthly',5),E('Student Loan',190,'Monthly',7),
    E('Internet',60,'Monthly',10),E('Streaming Services',15,'Monthly',12),E('Electricity',100,'Monthly',15),E('Credit Card Payment',75,'Monthly',18),
    E('Phone',50,'Monthly',20),E('Car Insurance',110,'Monthly',28),E('Renters Insurance',15,'Monthly (Last Day)'),
    E('Groceries',400,'Daily'),E('Dining Out',150,'Daily'),E('Gas / Commute',120,'Work Days')];
  var id=function(n){return ex.filter(function(e){return e.title===n})[0].id};
  var s0=newSource(0,2400,anchor);
  return {
    v:2,demo:true,
    sources:[s0,newSource(1,0,anchor),newSource(2,0,anchor),newSource(3,0,anchor)], nSrc:1,
    expenses:ex, entries:[],
    plan:{months:3,startBal:0},
    sv:{start:1000,asOf:anchor,apr:4.5,comp:'Monthly',months:12,actual:{}},
    debts:[{id:uid(),name:'Credit Card',type:'Credit Card',link:id('Credit Card Payment'),start:3000,apr:22.99,min:'',due:'',prio:'',asOf:dnISO(monthStart(T))},
      {id:uid(),name:'Car Loan',type:'Auto Loan',link:id('Car Payment'),start:9000,apr:6.5,min:'',due:'',prio:'',asOf:dnISO(monthStart(T))},
      {id:uid(),name:'Student Loan',type:'Student Loan',link:id('Student Loan'),start:15000,apr:5,min:'',due:'',prio:'',asOf:dnISO(monthStart(T))}],
    dcfg:{strategy:'Avalanche',mode:'fixed',fixed:100,pct:50,asOf:dnISO(monthStart(T))}
  };
}
function blank(){
  var d=defaults();d.demo=false;d.expenses=[];d.entries=[];d.debts=[];d.sources[0].amount=0;d.sv.start=0;return d;
}
var S=null, storeOK=true;
function normalize(o){
  var d=defaults();
  if(!o.sources){ /* version 1 data: one pay source */
    var s0=newSource(0,num(o.pay&&o.pay.amount,2943),o.pay&&o.pay.anchor);
    s0.every=Math.max(1,Math.round(num(o.pay&&o.pay.every,14)));
    if(o.sched){s0.start=o.sched.start||s0.start;s0.pat=o.sched.pat||s0.pat}
    o.sources=[s0,newSource(1,0,s0.anchor),newSource(2,0,s0.anchor),newSource(3,0,s0.anchor)];o.nSrc=1;
    o.sources.forEach(function(s,i){if(i){s.start=s0.start;s.every=s0.every;s.pat=s0.pat.slice()}});
  }
  o.sources.forEach(function(s){if(s.pat.length>7)s.pat=s.pat.slice(0,7)});
  while(o.sources.length<MAXSRC)o.sources.push(newSource(o.sources.length,0,o.sources[0].anchor));
  if(!o.nSrc)o.nSrc=1;
  if(!o.debts)o.debts=[];
  o.debts.forEach(function(d){if(!d.asOf)d.asOf=dnISO(monthStart(todayDN()))});
  if(!o.dcfg)o.dcfg=d.dcfg;
  o.dcfg=Object.assign({},d.dcfg,o.dcfg);
  o.v=2;delete o.pay;delete o.sched;
  return o;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.expenses&&(o.pay||o.sources))return normalize(o)}}catch(e){storeOK=false}
  return defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOK=false}}

/* ---------- model ---------- */
function compute(S){
  var T=todayDN(), cfg=S.dcfg;
  var ACT=S.sources.slice(0,S.nSrc);
  var SRC=ACT.filter(function(s){return !isNaN(isoDN(s.anchor))&&num(s.every)>=1});
  var maxEv=Math.max.apply(null,SRC.map(function(s){return Math.round(num(s.every))}).concat([14]));
  /* every pay date from every source, same-day pay added together */
  function payDates(a,b){
    var m={};

      if(c.series[1]){var q=nearest(c.series[1].pts,p[0]);c2.setAttribute('cx',c.X(q[0]));c2.setAttribute('cy',c.Y(q[1]));c2.style.display='';html+='<span class="muted">Minimums only '+m0(q[1])+'</span>'}else c2.style.display='none';
      ro.innerHTML=html;
    }
    svg.addEventListener('pointerdown',function(e){try{svg.setPointerCapture(e.pointerId)}catch(x){}at(e)});
    svg.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.buttons||svg.hasPointerCapture&&svg.hasPointerCapture(e.pointerId))at(e)});
    svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){g.setAttribute('display','none');ro.innerHTML=''}});
  });
}
function render(){
  M=compute(S);
  $('today').textContent=fd(M.T,{weekday:'short',month:'short',day:'numeric'});
  renderTabs();
  $('view').innerHTML=tab==='budget'?viewBudget():tab==='paychecks'?viewPaychecks():tab==='savings'?viewSavings():tab==='debt'?viewDebt():viewSettings();
  bindCharts();
}
function commit(){save();var y=window.scrollY,open=[].map.call(document.querySelectorAll('details.pc'),function(d){return d.open});render();[].forEach.call(document.querySelectorAll('details.pc'),function(d,i){if(open[i]!=null)d.open=open[i]});window.scrollTo(0,y)}

/* ---------- sheets ---------- */
function expenseSheet(id){
  var e=S.expenses.filter(function(x){return x.id===id})[0],isNew=!e;
  if(isNew)e={id:uid(),title:'',amount:'',freq:'Monthly',due:''};
  openSheet('<h3>'+(isNew?'New expense':'Edit expense')+'</h3><form id="ef" class="form" style="padding:0" data-id="'+e.id+'" data-new="'+(isNew?1:0)+'">'+
    '<div class="field"><label for="et">Title</label><input id="et" required value="'+esc(e.title)+'" autocomplete="off"></div>'+
    '<div class="grid2"><div class="field"><label for="ea">Monthly amount</label><input id="ea" type="number" inputmode="decimal" step="0.01" min="0" required value="'+esc(e.amount)+'"></div>'+
    '<div class="field"><label for="ef2">Frequency</label><select id="ef2">'+FREQS.map(function(f){return '<option'+(f===e.freq?' selected':'')+'>'+f+'</option>'}).join('')+'</select></div></div>'+
    '<div class="field" id="duew"><label for="ed">Due day of month</label><input id="ed" type="number" inputmode="numeric" min="1" max="31" step="1" value="'+esc(e.due)+'"><span class="hint">Days past the end of a short month fall on its last day.</span></div>'+
    '<p class="muted" id="fh" style="margin:0;font-size:13px"></p>'+
    (M.linked[e.id]?'<p class="note" style="margin:0">Linked to the debt "'+esc(debtName(M.linked[e.id]))+'". Its payments come from the Debt tab, so this expense is left out of the paycheck bills.</p>':'')+
    '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" id="edel">Delete</button>')+'<div class="r"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>','et');
  syncFreq();
}
function syncFreq(){
  var f=$('ef2');if(!f)return;var v=f.value;$('duew').hidden=v!=='Monthly';
  $('fh').textContent={'Daily':'The monthly amount is spread evenly over every day.','Weekly':'The monthly amount is spread evenly over every day, and shows in its own column on each paycheck.','Work Days':'The monthly amount is spread over the days you work only.','Bi-Weekly':'Half the monthly amount comes out of each paycheck.','Monthly':'Charged in full on its due day.','Monthly (Last Day)':'Charged in full on the last day of every month, whatever its length.'}[v]||'';
}
function entrySheet(id){
  var e=S.entries.filter(function(x){return x.id===id})[0],isNew=!e;
  if(isNew)e={id:uid(),type:'expense',desc:'',date:dnISO(M.nextPay),amount:'',debt:''};
  openSheet('<h3>'+(isNew?'Add to paycheck plan':'Edit entry')+'</h3><form id="nf" class="form" style="padding:0" data-id="'+e.id+'" data-new="'+(isNew?1:0)+'" data-type="'+e.type+'">'+
    '<div class="seg" role="group" aria-label="Type"><button type="button" data-type="expense" aria-pressed="'+(e.type!=='bonus')+'">Expense</button><button type="button" data-type="bonus" aria-pressed="'+(e.type==='bonus')+'">Bonus</button></div>'+
    '<div class="field"><label for="nd">Description</label><input id="nd" value="'+esc(e.desc)+'" placeholder="Trip, car repair, year-end bonus" autocomplete="off"></div>'+
    '<div class="grid2"><div class="field"><label for="nm">Date</label><input id="nm" type="date" required value="'+esc(e.date)+'"></div>'+
    '<div class="field"><label for="na">Amount</label><input id="na" type="number" inputmode="decimal" step="0.01" required value="'+esc(e.amount)+'"></div></div>'+
    '<div class="field" id="ndebtw"'+(e.type==='bonus'?' hidden':'')+'><label for="ndebt">Apply to debt (optional)</label><select id="ndebt"><option value="">None, an ordinary expense</option>'+S.debts.map(function(d){return '<option value="'+d.id+'"'+(d.id===e.debt?' selected':'')+'>'+esc(d.name||'Debt')+'</option>'}).join('')+'</select><span class="hint">Pick a debt to make this an extra payment on it. It lowers that balance on the Debt tab.</span></div>'+
    '<p class="muted" style="margin:0;font-size:13px">Enter the amount as a positive number. It is charged to, or added to, the paycheck whose dates cover the entry date.</p>'+
    '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" id="ndel">Delete</button>')+'<div class="r"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>',isNew?'nd':null);
}
function debtSheet(id){
  var d=S.debts.filter(function(x){return x.id===id})[0],isNew=!d;
  if(isNew)d={id:uid(),name:'',type:'Credit Card',link:'',start:'',apr:'',min:'',due:'',prio:''};
  var monthly=S.expenses.filter(function(e){return e.freq==='Monthly'});
  openSheet('<h3>'+(isNew?'New debt':'Edit debt')+'</h3><form id="df" class="form" style="padding:0" data-id="'+d.id+'" data-new="'+(isNew?1:0)+'">'+
    '<div class="grid2"><div class="field"><label for="dn">Debt name</label><input id="dn" required value="'+esc(d.name)+'" autocomplete="off"></div>'+
    '<div class="field"><label for="dt">Type</label><select id="dt">'+DTYPES.map(function(t){return '<option'+(t===d.type?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div></div>'+
    '<div class="field"><label for="dl">Link to Budget expense (optional)</label><select id="dl"><option value="">None</option>'+monthly.map(function(e){return '<option value="'+e.id+'"'+(e.id===d.link?' selected':'')+'>'+esc(e.title)+'</option>'}).join('')+'</select><span class="hint" id="dlh"></span></div>'+
    '<div class="grid2"><div class="field"><label for="db">Current balance</label><input id="db" type="number" inputmode="decimal" step="0.01" min="0" required value="'+esc(d.start)+'"><span class="hint">From a recent statement. It counts down on its own as payments are made. Change it any time to match your statement.</span></div>'+
    '<div class="field"><label for="dr">APR %</label><input id="dr" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(d.apr)+'"></div></div>'+
    '<div class="grid2"><div class="field"><label for="dm">Minimum payment</label><input id="dm" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(d.min)+'"></div>'+
    '<div class="field"><label for="du">Due day (1-31)</label><input id="du" type="number" inputmode="numeric" step="1" min="1" max="31" value="'+esc(d.due)+'"></div></div>'+
    '<div class="field"><label for="dp2">Priority (Custom strategy)</label><input id="dp2" type="number" inputmode="numeric" step="1" min="1" max="20" value="'+esc(d.prio)+'"><span class="hint">1 is paid first.</span></div>'+
    '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" id="ddel">Delete</button>')+'<div class="r"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>',isNew?'dn':null);
  syncDebt();
}
function syncDebt(){
  var l=$('dl');if(!l)return;var e=S.expenses.filter(function(x){return x.id===l.value})[0],on=!!e;
  $('dm').disabled=on;$('du').disabled=on;
  if(on){$('dm').value=num(e.amount);$('du').value=Math.round(num(e.due,1))||1}
  $('dlh').textContent=on?'Minimum and due day come from Budget. Choose None to type your own.':'';
}
var WN=[];
function wizard(step){
  var DNm=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if(step===1)openSheet('<h3>Step 1 of 3 · Your pay</h3><form id="w1" class="form" style="padding:0"><div class="field"><label for="w1a">Pay per paycheck</label><input id="w1a" type="number" inputmode="decimal" step="0.01" min="0" required></div>'+
    '<div class="grid2"><div class="field"><label for="w1e">Days between paychecks</label><input id="w1e" type="number" inputmode="numeric" min="1" step="1" value="14" required><span class="hint">14 = every two weeks</span></div>'+
    '<div class="field"><label for="w1d">Last payday</label><input id="w1d" type="date" required></div></div><p class="muted" style="margin:0;font-size:13px">Extra pay sources can be added later in Settings.</p>'+
    '<div class="acts"><div class="r"><button type="submit" class="btn primary">Next</button></div></div></form>','w1a');
  else if(step===2){var pat=S.sources[0].pat;
    openSheet('<h3>Step 2 of 3 · Your work days</h3><p class="muted" style="margin:0;font-size:14px">Tap the days you work. Expenses set to Work Days, such as gas, are spread over these days.</p><div class="sched">'+DNm.map(function(n){return '<div class="dn">'+n+'</div>'}).join('')+
      DNm.map(function(n,i){return '<button type="button" data-wday="'+i+'" aria-pressed="'+(pat[i]?'true':'false')+'" aria-label="'+n+'">'+(pat[i]?'Work':'Off')+'</button>'}).join('')+'</div>'+
      '<div class="acts"><div class="r"><button type="button" class="btn primary" data-wnext="3">Next</button></div></div>');}
  else openSheet('<h3>Step 3 of 3 · Your bills</h3><p class="muted" style="margin:0;font-size:14px">Add each bill or regular spending. '+(WN.length?'<b>Added: '+esc(WN.join(', '))+'</b>':'You can add more any time on the Budget tab.')+'</p>'+
    '<form id="w3" class="form" style="padding:0"><div class="field"><label for="w3t">Title</label><input id="w3t" required autocomplete="off" placeholder="Rent, Groceries, Phone"></div>'+
    '<div class="grid2"><div class="field"><label for="w3a">Monthly amount</label><input id="w3a" type="number" inputmode="decimal" step="0.01" min="0" required></div>'+
    '<div class="field"><label for="w3f">Frequency</label><select id="w3f">'+FREQS.map(function(f){return '<option'+(f==='Monthly'?' selected':'')+'>'+f+'</option>'}).join('')+'</select></div></div>'+
    '<div class="field" id="w3dw"><label for="w3d">Due day of month</label><input id="w3d" type="number" inputmode="numeric" min="1" max="31" step="1"></div>'+
    '<div class="acts"><button type="button" class="btn" data-wdone>Done</button><div class="r"><button type="submit" class="btn primary">Add bill</button></div></div></form>','w3t');
}
function armDelete(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';btn.textContent='Tap again to delete';setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Delete'}},3000);
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem(KEY+'-tab',tab)}catch(e){}render();window.scrollTo(0,0);return}
  if(t.dataset.wday!=null){var pw=S.sources[0].pat,wk=+t.dataset.wday;pw[wk]=pw[wk]?0:1;wizard(2);return}
  if(t.dataset.wnext){wizard(3);return}
  if(t.hasAttribute('data-wdone')){closeSheet();WN=[];tab='budget';commit();toast('All set. Add debts on the Debt tab');return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.hasAttribute('data-demo-clear')){S=blank();save();render();wizard(1);return}
  if(t.hasAttribute('data-demo-keep')){S.demo=false;commit();toast('Examples kept');return}
  if(t.hasAttribute('data-snooze')){lsSet('-snooze',Date.now()+14*864e5);render();return}
  if(t.hasAttribute('data-add-expense')){expenseSheet();return}
  if(t.dataset.edit){expenseSheet(t.dataset.edit);return}
  if(t.hasAttribute('data-add-entry')){entrySheet();return}
  if(t.dataset.editEntry){entrySheet(t.dataset.editEntry);return}
  if(t.hasAttribute('data-add-debt')){debtSheet();return}
  if(t.dataset.editDebt){debtSheet(t.dataset.editDebt);return}
  if(t.dataset.help){var hb=document.getElementById('help-'+t.dataset.help);if(hb){hb.hidden=!hb.hidden;t.setAttribute('aria-expanded',String(!hb.hidden))}return}
  if(t.dataset.strat){S.dcfg.strategy=t.dataset.strat;commit();return}
  if(t.dataset.mode){S.dcfg.mode=t.dataset.mode;commit();return}
  if(t.dataset.nsrc){S.nSrc=+t.dataset.nsrc;commit();return}
  if(t.id==='edel'){var id=$('ef').dataset.id;armDelete(t,function(){S.expenses=S.expenses.filter(function(x){return x.id!==id});S.debts.forEach(function(d){if(d.link===id)d.link=''});closeSheet();commit();toast('Expense deleted')});return}
  if(t.id==='ndel'){var id2=$('nf').dataset.id;armDelete(t,function(){S.entries=S.entries.filter(function(x){return x.id!==id2});closeSheet();commit();toast('Entry deleted')});return}
  if(t.id==='ddel'){var id3=$('df').dataset.id;armDelete(t,function(){S.debts=S.debts.filter(function(x){return x.id!==id3});S.entries.forEach(function(e){if(e.debt===id3)e.debt=''});closeSheet();commit();toast('Debt deleted')});return}
  if(t.closest('#nf')&&t.dataset.type){var f=$('nf');f.dataset.type=t.dataset.type;$('ndebtw').hidden=t.dataset.type==='bonus';[].forEach.call(f.querySelectorAll('.seg button'),function(b){b.setAttribute('aria-pressed',b===t?'true':'false')});return}
  if(t.dataset.day!=null){var p=t.dataset.day.split(':'),k=+p[1],pat=S.sources[+p[0]].pat;pat[k]=pat[k]?0:1;commit();return}
  if(t.hasAttribute('data-backup')){var txt=JSON.stringify(S);
    var done=function(){lsSet('-bk',Date.now());toast('Backup copied');render()};
    try{navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt)})}catch(e){fallbackCopy(txt)}return}
  if(t.hasAttribute('data-restore-open')){$('restorebox').hidden=false;$('rt').focus();return}
  if(t.hasAttribute('data-restore')){try{var o=JSON.parse($('rt').value);if(!o||!o.expenses||!(o.sources||o.pay)||!o.sv)throw 0;S=normalize(o);commit();toast('Backup restored')}catch(e){toast('That is not a valid backup')}return}
  if(t.hasAttribute('data-reset')){armDelete2(t);return}
});
function armDelete2(btn){
  if(btn.dataset.armed){S=defaults();commit();toast('Reset to example data');return}
  btn.dataset.armed='1';btn.textContent='Tap again to erase everything and reset';setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Reset to example data'}},3500);
}
function fallbackCopy(txt){lsSet('-bk',Date.now());
  openSheet('<h3>Copy your backup</h3><textarea id="bk" readonly spellcheck="false"></textarea><div class="acts"><div class="r"><button type="button" class="btn primary" data-close>Done</button></div></div>','bk');
  var ta=$('bk');ta.value=txt;ta.select();
}
$('scrim').addEventListener('click',function(e){if(e.target===$('scrim'))closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('scrim').hidden)closeSheet()});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='ef2'){syncFreq();return}
  if(t.id==='dl'){syncDebt();return}
  if(t.id==='w3f'){$('w3dw').hidden=t.value!=='Monthly';return}
  if(t.dataset.plan){S.plan[t.dataset.plan]=t.dataset.plan==='months'?+t.value:num(t.value);commit();return}
  if(t.dataset.sv){var k=t.dataset.sv;S.sv[k]=(k==='comp'||k==='asOf')?t.value:k==='months'?Math.min(24,Math.max(1,Math.round(num(t.value,12)))):num(t.value);commit();return}
  if(t.dataset.src){var q=t.dataset.src.split(':'),s=S.sources[+q[0]],key=q[1];
    s[key]=key==='name'||key==='anchor'||key==='start'?t.value:key==='every'?Math.max(1,Math.round(num(t.value,14))):num(t.value);commit();return}
  if(t.dataset.dcfg){var kk=t.dataset.dcfg;S.dcfg[kk]=kk==='asOf'?t.value:num(t.value);commit();return}
  if(t.dataset.actual){var iso=t.dataset.actual;if(t.value===''||isNaN(parseFloat(t.value)))delete S.sv.actual[iso];else S.sv.actual[iso]=parseFloat(t.value);commit();return}
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==='w1'){
    var s0=S.sources[0];s0.amount=num($('w1a').value);s0.every=Math.max(1,Math.round(num($('w1e').value,14)));s0.anchor=$('w1d').value;S.nSrc=1;save();wizard(2);return;
  }
  if(f.id==='w3'){
    var fq=$('w3f').value,wo={id:uid(),title:$('w3t').value.trim(),amount:num($('w3a').value),freq:fq,due:fq==='Monthly'&&$('w3d').value!==''?Math.min(31,Math.max(1,Math.round(num($('w3d').value)))):''};
    S.expenses.push(wo);WN.push(wo.title);save();wizard(3);toast('Added '+wo.title);return;
  }
  if(f.id==='ef'){
    var o={id:f.dataset.id,title:$('et').value.trim(),amount:num($('ea').value),freq:$('ef2').value,due:$('ed').value===''?'':Math.min(31,Math.max(1,Math.round(num($('ed').value))))};
    if(o.freq!=='Monthly'){o.due='';S.debts.forEach(function(d){if(d.link===o.id)d.link=''})}
    var i=S.expenses.findIndex(function(x){return x.id===o.id});if(i<0)S.expenses.push(o);else S.expenses[i]=o;
    closeSheet();commit();toast('Expense saved');
  }else if(f.id==='nf'){
    var n={id:f.dataset.id,type:f.dataset.type,desc:$('nd').value.trim(),date:$('nm').value,amount:Math.abs(num($('na').value)),debt:f.dataset.type==='bonus'?'':$('ndebt').value};
    var j=S.entries.findIndex(function(x){return x.id===n.id});if(j<0)S.entries.push(n);else S.entries[j]=n;
    closeSheet();commit();toast(n.type==='bonus'?'Bonus saved':n.debt?'Extra payment saved':'Entry saved');
  }else if(f.id==='df'){
    var dd={id:f.dataset.id,name:$('dn').value.trim(),type:$('dt').value,link:$('dl').value,start:num($('db').value),apr:num($('dr').value),
      min:$('dl').value?'':num($('dm').value),due:$('dl').value?'':($('du').value===''?'':Math.min(31,Math.max(1,Math.round(num($('du').value))))),
      prio:$('dp2').value===''?'':Math.round(num($('dp2').value))};
    var old=S.debts.filter(function(y){return y.id===dd.id})[0];dd.asOf=old&&old.asOf&&num(old.start)===dd.start?old.asOf:dnISO(monthStart(todayDN()));
    var x=S.debts.findIndex(function(y){return y.id===dd.id});if(x<0)S.debts.push(dd);else S.debts[x]=dd;
    closeSheet();commit();toast('Debt saved');
  }
});

S=load();if(!lsGet('-first'))lsSet('-first',Date.now());save();render();
})();
</script>
